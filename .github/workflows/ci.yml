name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flake8

      - name: Run flake8 linting
        run: flake8 src/ --max-line-length=120 --ignore=E501,W291,W293,W292,W303,E221,E302,W391,E303,E241

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Create dbt profiles
        env:
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          devtrend:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                dbname: devtrend_db
                user: devtrend_user
                password: ${DBT_PASSWORD }
                schema: public
                threads: 1
          EOF


      - name: dbt parse check
        run: cd dbt && dbt parse
        