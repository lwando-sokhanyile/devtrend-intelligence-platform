version: '3.8'

# ── Shared environment variables ──────────────────────────────────────────────
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    # Pass your app environment variables into Airflow
    GITHUB_TOKEN: ${GITHUB_TOKEN}
    DB_HOST: postgres
    DB_PORT: ${DB_PORT}
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    PYTHONPATH: /opt/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - devtrend-network

# ══════════════════════════════════════════════════════════════════════════════
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: devtrend-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d  # runs SQL files on first start
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 10s
    networks:
      - devtrend-network
    restart: unless-stopped

  # ── Airflow Init ─────────────────────────────────────────────────────────────
  # Runs once to set up the Airflow database and create the admin user
  airflow-init:
    <<: *airflow-common
    container_name: devtrend-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Lwando \
          --lastname Sokhanyile \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL}
    restart: on-failure

  # ── Airflow Webserver ────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: devtrend-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: devtrend-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Collectors ───────────────────────────────────────────────────────────────
  # Runs all 3 collectors once on startup then exits
  # In production, Airflow triggers this on schedule
  collectors:
    build:
      context: .
      dockerfile: docker/Dockerfile.collectors
    container_name: devtrend-collectors
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtrend-network
    restart: "no"   # runs once and exits — Airflow handles scheduling
    profiles: ["collectors"]

  # ── dbt ─────────────────────────────────────────────────────────────────────
  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    container_name: devtrend-dbt
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dbt:/dbt                    # live-mount so you can edit models without rebuilding
      - ./logs:/dbt/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtrend-network
    restart: "no"   # runs once and exits — Airflow triggers it after collectors
    profiles: ["dbt"]

  # ── Metabase ─────────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:v0.49.0
    container_name: devtrend-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_PORT: 5432
      MB_DB_USER: ${DB_USER}
      MB_DB_PASS: ${DB_PASSWORD}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devtrend-network
    restart: unless-stopped
    profiles: ["metabase"]

# ── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local

networks:
  devtrend-network:
    driver: bridge
